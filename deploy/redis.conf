# Cache only. Neither database records nor login sessions are stored here.
bind 127.0.0.1
protected-mode yes
port 6379
daemonize no
supervised no
logfile ""
loglevel notice
dir /tmp
save ""
appendonly no
maxmemory 128mb
# Do not silently evict login rate-limit counters under memory pressure.
maxmemory-policy noeviction
maxclients 256
tcp-keepalive 60
