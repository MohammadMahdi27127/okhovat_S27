[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/okhovat-supervisord.pid
childlogdir=/tmp
umask=027

[program:redis]
command=/usr/bin/redis-server /app/deploy/redis.conf
directory=/tmp
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=/usr/local/bin/gunicorn -c /app/backend/gunicorn.conf.py config.wsgi:application
directory=/app/backend
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
